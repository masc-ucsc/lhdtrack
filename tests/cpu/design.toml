[design]
name = "cpu"
top = "cpu"
kind = "sequential"
suite = "cpu"

[provenance]
upstream = "veryl"
url = "https://github.com/veryl-lang/veryl"
rev = "46ffa40d940b5540f33a25fda2d4d894dd2aa9a9"
path = "crates/simulator/compare/cpu/test.sv"
license = "MIT"

[status]
pyrope = "idiomatic"
lec = "proven"

[pyrope]
param_binding = "monomorphic"

[[config]]
id = "rv32_w32_d256"
params = {}
sim_checksum = { cycles = 10000000, value = "11144181027426691521" }

[synth]
flows = ["syn_yosys_abc", "syn_lhd_verilog", "syn_lhd_pyrope"]

[sim]
flows = ["sim_verilator", "sim_lhd_verilog", "sim_lhd_pyrope"]
# Ten million cycles gives useful timing while keeping the comparison quick.
cycles = 10000000
marker = "LHDTRACK-DONE"

[lec]
flows = ["lec_lgyosys", "lec_lhd", "lec_netlist"]

# Explicit state correspondence for the idiomatic pipeline records.

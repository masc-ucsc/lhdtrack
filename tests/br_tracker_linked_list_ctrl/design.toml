# br_tracker_linked_list_ctrl -- see README.md for provenance.
[design]
name  = "br_tracker_linked_list_ctrl"
top   = "br_tracker_linked_list_ctrl"
kind  = "sequential"          # combinational | sequential
suite = "tracker"         # groups the report; NOT a path component

[provenance]
upstream = "bedrock-rtl"             # e.g. "bedrock-rtl"
rev      = "0a990f222cd970fdaec42c6e0a4e372cf0e1400f"             # the exact commit this was taken from
path     = "tracker/rtl/br_tracker_linked_list_ctrl.sv"             # the upstream path of the source
license  = "Apache-2.0"             # SPDX id; LICENSE carries the full text

[status]
# none | auto | idiomatic -- `auto` is a machine emission from the Verilog and
# measures FRONT ENDS, not languages, so it never enters a headline geomean.
pyrope = "auto"
# none | proven | failed | unsupported -- until `proven`, a QoR win might just
# be a different circuit.
# `refuted` until 2026-08-27, and the refutation was never a real one: the
# emitted Pyrope did not parse (`stage` unescaped -- see tools/prp_fixups.py), so
# nothing was ever proven or disproven. With the emission readable, cvc5
# proves it; lgyosys answers `unsupported` (its cgen has no forwarding model
# for a whole-array read with a collision matrix) -- which is the absence of
# a verdict, not a refutation.
lec    = "proven"

# One elaborated parameter set per entry. Benchmark id is `br_tracker_linked_list_ctrl#<id>`.
[[config]]
id     = "d128_nll4_nwp4_rrl2"
# NO PARAMETERS. verilog/br_tracker_linked_list_ctrl.sv declares its parameter
# port list `localparam`, so the top elaborates to ONE circuit with no flags
# anywhere -- no -chparam for yosys, no -G for slang or verilator, no `#(...)`
# on the harness instance -- and the .prp, which cannot take a parameter at
# all, matches it by construction. Intermediate modules stay parameterized;
# the top overrides them.
#
# THE CHOSEN POINT IS Depth=128, NumLinkedLists=4, NumWritePorts=4,
# RamReadLatency=2. To move it, edit the localparam in the .sv and re-seed, so
# the harness and the emitted Pyrope follow -- not this line.
params = {}

[synth]
flows = ["syn_yosys_abc", "syn_lhd_verilog", "syn_lhd_pyrope"]

[sim]
flows  = ["sim_verilator", "sim_lhd_verilog", "sim_lhd_pyrope"]
# Tuned so one simulation lands in the 2-10 s window. Re-check after any large
# simulator speedup: a benchmark that has outrun its cycle count reports
# process startup, not the simulator.
cycles = 1000000
marker = "LHDTRACK-DONE"

[lec]
# lgcheck (yosys) is the baseline; lhd's own solver is measured against it.
flows = ["lec_lgyosys", "lec_lhd", "lec_netlist"]

# carry_save_select -- see README.md for provenance.
[design]
name  = "carry_save_select"
top   = "CarrySaveSelect"
kind  = "combinational"          # combinational | sequential
suite = "datapath"         # groups the report; NOT a path component

[provenance]
upstream = "DatapathBench"             # e.g. "bedrock-rtl"
url      = "https://github.com/cowardsa/DatapathBench"             # the upstream repository
rev      = "2205f4b929a3824bdcb937715fb2bbc61730fa54"             # the exact commit this was taken from
path     = "benchmarks/CarrySaveSelect/sv/CarrySaveSelect.sv"             # the upstream path of the source
license  = "MIT"             # SPDX id; LICENSE carries the full text

[status]
# none | auto | idiomatic -- `auto` is a machine emission from the Verilog and
# measures FRONT ENDS, not languages, so it never enters a headline geomean.
pyrope = "auto"
# none | proven | refuted | timeout | unsupported | error -- the SAME words the
# LEC flows emit (corpus.LEC_STATUS). "failed" is not one of them: a manifest
# written from this comment would be rejected by every load_test() call.
# Until `proven`, a QoR win might just be a different circuit.
lec    = "proven"

# One elaborated parameter set per entry. Benchmark id is `carry_save_select#<id>`.
[[config]]
id     = "bw24"
sim_checksum = { cycles = 66100000, value = "6918086648753160440" }
# NO PARAMETERS. verilog/CarrySaveSelect.sv declares its parameter port list
# `localparam`, so the top elaborates to ONE circuit with no flags anywhere --
# no -chparam for yosys, no -G for slang or verilator, no `#(...)` on the
# harness instance -- and the .prp, which cannot take a parameter at all,
# matches it by construction. Intermediate modules stay parameterized; the top
# overrides them.
#
# THE CHOSEN POINT IS BW=24. To move it, edit the localparam in the .sv and
# re-seed, so the harness and the emitted Pyrope follow -- not this line.
params = {}

[synth]
flows = ["syn_yosys_abc", "syn_lhd_verilog", "syn_lhd_pyrope"]

[sim]
flows  = ["sim_verilator", "sim_lhd_verilog", "sim_lhd_pyrope"]
# Tuned so one verilator simulation lands near 2 s (1-3 s window). Re-check after any large
# simulator speedup: a benchmark that has outrun its cycle count reports
# process startup, not the simulator.
cycles = 66100000
marker = "LHDTRACK-DONE"

[lec]
# Both backends prove the same obligation -- lgcheck (yosys) is the baseline,
# lhd's in-process solver is what is being measured against it.
flows = ["lec_lgyosys", "lec_lhd", "lec_netlist"]

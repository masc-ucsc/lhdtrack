# sub -- see README.md for provenance.
[design]
name  = "sub"
top   = "sub"
kind  = "combinational"          # combinational | sequential
suite = "comb"         # groups the report; NOT a path component

[provenance]
upstream = "circt-synth-tracker"             # e.g. "bedrock-rtl"
rev      = "85721d2fd9cf49ce6eb436f7d4671590b55288c1"             # the exact commit this was taken from
path     = "benchmarks/comb/microbenchmarks/sub.sv"             # the upstream path of the source
license  = "Apache-2.0 WITH LLVM-exception"             # SPDX id; LICENSE carries the full text

[status]
# none | auto | idiomatic -- `auto` is a machine emission from the Verilog and
# measures FRONT ENDS, not languages, so it never enters a headline geomean.
pyrope = "auto"
# none | proven | failed | unsupported -- until `proven`, a QoR win might just
# be a different circuit.
lec    = "proven"

# One elaborated parameter set per entry. Benchmark id is `sub#<id>`.
[[config]]
id     = "bw8"
# NO PARAMETERS. verilog/sub.sv declares its parameter port list `localparam`,
# so the top elaborates to ONE circuit with no flags anywhere -- no -chparam
# for yosys, no -G for slang or verilator, no `#(...)` on the harness instance
# -- and the .prp, which cannot take a parameter at all, matches it by
# construction. Intermediate modules stay parameterized; the top overrides
# them.
#
# THE CHOSEN POINT IS BW=8. To move it, edit the localparam in the .sv and
# re-seed, so the harness and the emitted Pyrope follow -- not this line.
params = {}

[synth]
flows = ["syn_yosys_abc", "syn_lhd_verilog", "syn_lhd_pyrope"]

[sim]
flows  = ["sim_verilator", "sim_lhd_verilog", "sim_lhd_pyrope"]
# Tuned so one simulation lands in the 2-10 s window. Re-check after any large
# simulator speedup: a benchmark that has outrun its cycle count reports
# process startup, not the simulator.
cycles = 1000000
marker = "LHDTRACK-DONE"

[lec]
# lgcheck (yosys) is the baseline; lhd's own solver is measured against it.
flows = ["lec_lgyosys", "lec_lhd", "lec_netlist"]
